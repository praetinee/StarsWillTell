        function getAutoDignity(planetId, signId) {
            const rules = {
                1: { kaset: [4], uch: [0], nit: [6], pra: [10], mahajak: [3], rachachok: [2] },
                2: { kaset: [3], uch: [1], nit: [7], pra: [9], mahajak: [0], rachachok: [5] },

                4: { kaset: [2, 5], uch: [5], nit: [11], pra: [8, 11], mahajak: [4], rachachok: [4] },

                7: { kaset: [9, 10], uch: [6], nit: [0], pra: [3, 4], mahajak: [1], rachachok: [7] },
                8: { kaset: [10], uch: [7], nit: [1], pra: [4], mahajak: [9], rachachok: [6] }
            };

            let dignities = [];
            const p = parseInt(planetId);
            const s = parseInt(signId);

            if (rules[p]) {
                if (rules[p].kaset.includes(s)) dignities.push("<span class='text-emerald-400 font-bold'>เกษตร (มั่นคง ถาวร)</span>");
                if (rules[p].uch.includes(s)) dignities.push("<span class='text-yellow-400 font-bold'>มหาอุจจ์ (ยิ่งใหญ่ สูงสุด)</span>");
                if (rules[p].mahajak.includes(s)) dignities.push("<span class='text-orange-400 font-bold'>มหาจักร (บุกบั่น ผาดโผน)</span>");
                if (rules[p].rachachok.includes(s)) dignities.push("<span class='text-pink-400 font-bold'>ราชาโชค (ง่ายดาย อุปถัมภ์)</span>");
                if (rules[p].pra.includes(s)) dignities.push("<span class='text-gray-400'>ประ (ไม่มั่นคง ของคนอื่น)</span>");
                if (rules[p].nit.includes(s)) dignities.push("<span class='text-red-400'>นิจ (ต่ำต้อย อ่อนกำลัง)</span>");
            }
            return dignities;
        }

            "2-7": "คู่พลัดพราก: อมทุกข์ วิตกกังวล ห่างไกลคนรัก หรือมีหนี้สิน/ภาระเหนื่อยหนัก",
            "2-8": "คู่สมพล/หลงผิด: หมุนเงินก้อนใหญ่ เป็นหนี้ง่าย ใจอ่อนเชื่อคนง่าย ระวังถูกหลอก",
            "3-4": "คู่ศัตรู/วิวาท: ปะทะฝีปาก พูดจาขวานผ่าซาก ระวังคดีความเอกสารหรือทะเลาะเบาะแว้ง",
            "3-5": "คู่สมพล/นักสู้: ขยันขันแข็ง บ้างาน แก้ปัญหาเก่ง เหนื่อยแต่สำเร็จด้วยตัวเอง",
            "3-6": "คู่มิตร/ความรัก: สมหวังในความรัก เสน่ห์แรงมาก ขยันหาเงิน สายปาร์ตี้บันเทิง",
            "3-7": "คู่ศัตรูใหญ่: แตกหัก รุนแรง อุบัติเหตุใหญ่ ผ่าตัด หรือมีเรื่องเครียดขั้นสุด",
            "3-8": "คู่ธาตุลม/นักเลง: ใจกล้าบ้าบิ่น ลุยๆ ไม่กลัวใคร พลิกแพลงเก่ง ระวังอารมณ์วู่วาม",
            "4-5": "คู่นักปราชญ์: มีเหตุผล สติปัญญาดีมาก เรียนรู้เร็ว เหมาะกับงานวิชาการ/กฎหมาย",
            "4-6": "คู่ธาตุน้ำ: ร่มเย็น อ่อนโยน เจรจาพารวย ศิลปะดี หาเงินเก่งด้วยการพูด/เขียน",
            "4-7": "คู่สมพล/เหนื่อย: ทำงานหนัก คิดมาก เจรจายากลำบาก ต้องใช้ความพยายามสูงมาก",
            "4-8": "คู่ศัตรู/เล่ห์เหลี่ยม: ฉลาดแกมโกง โน้มน้าวเก่ง ทันคน แต่สัญญาและคำพูดมักมีหมกเม็ด/ซ่อนเร้น",
            "5-6": "คู่ศัตรู/ขัดแย้ง: ขัดแย้งระหว่างอุดมการณ์กับความรัก/การเงิน สุขนิยมผสมศีลธรรม",
            "5-7": "คู่พระคู่โจร/พลิกผัน: ความคิดขัดแย้งในตัว จุดหักเหชีวิตสูง ระวังข้อกฎหมาย/ผู้ใหญ่ให้โทษ",
            "5-8": "คู่พลิกแพลง: ทันโลก ทันเกม รู้หลบรู้หลีก แต่ระวังความหลงผิดหรือออกนอกลู่นอกทาง",
            "6-7": "คู่ศัตรู/คู่ทุกข์: ผิดหวังเรื่องรัก/เงิน อกหัก รักคุด หรือได้ทรัพย์มาก็ต้องเสียไป",
            "6-8": "คู่ลุ่มหลง/มัวเมา: ลุ่มหลงกิเลส การพนัน รักสนุก ใช้เงินเก่ง สังคมจัด หรือรักซ้อน",
            "7-8": "คู่มิตรใหญ่: กว้างขวาง มีอิทธิพล คอนเนคชั่นแน่น ทำธุรกิจสีเทาหรือโปรเจกต์ใหญ่ดีมาก"
        };

        // DOM Elements
        const elBirthDay = document.getElementById('birthDay');
        const elAscendant = document.getElementById('ascendant');
        const elPlanet = document.getElementById('planet');
        const elPlanetSign = document.getElementById('planetSign');
        const elSunSign = document.getElementById('sunSign'); // เพิ่มบรรทัดนี้
        const elMotion = document.getElementById('motion');
        const elResultContent = document.getElementById('resultContent');
        

        // Populate Select Options
        function initSelects() {
            signs.forEach(sign => {
                const ascOption = document.createElement('option');
                ascOption.value = sign.id;
                ascOption.textContent = `${sign.name} (ธาตุ${sign.element})`;
                elAscendant.appendChild(ascOption);

                const destOption = document.createElement('option');
                destOption.value = sign.id;
                destOption.textContent = `${sign.name} (ธาตุ${sign.element})`;
                elPlanetSign.appendChild(destOption);

                const sunOption = document.createElement('option');
                sunOption.value = sign.id;
                sunOption.textContent = `${sign.name} (ธาตุ${sign.element})`;
                elSunSign.appendChild(sunOption); // แทรกบล็อกนี้
            });
        }

        // Logical Functions
        function getHouseIndex(ascSign, targetSign) {
            return (targetSign - ascSign + 12) % 12;
        }

        function getRuledHouses(ascSign, planetId) {
            const ruledSigns = planetRulership[planetId];
            return ruledSigns.map(sign => getHouseIndex(ascSign, sign));
        }

        function calculateReading() {
            const birthDay = parseInt(elBirthDay.value);
            const ascSign = parseInt(elAscendant.value);
            const planet = parseInt(elPlanet.value);
            const targetSign = parseInt(elPlanetSign.value);
            const motion = elMotion.value;

            // 1. หาดาวกาลกิณี และตรวจสอบธาตุ
            const karakiniPlanet = karakiniMap[birthDay];
            const isKarakini = (planet === karakiniPlanet);
            const targetElement = signs[targetSign].element;
            let karakiniNeutralized = false;
            if (isKarakini && (targetElement === 'น้ำ' || targetElement === 'ดิน')) {
                karakiniNeutralized = true;
            }

            // 2. หาภพปลายทาง
            const destHouseIndex = getHouseIndex(ascSign, targetSign);
            const destHouseName = houses[destHouseIndex];

            // 3. เริ่มสร้าง HTML ผลลัพธ์
            let html = '';

            // ตรรกะแยกสำหรับดาว เกตุ (9) และ มฤตยู (0) 
            if (planet === 9 || planet === 0) {
                const pName = planet === 9 ? 'ดาวเกตุ (๙)' : 'ดาวมฤตยู (๐)';
                const meaning = specialMeanings[planet][destHouseName];
                const themeColor = planet === 9 ? 'purple' : 'teal'; // เกตุสีม่วง, มฤตยูสีเขียวอมฟ้า
                
                html += `
                    <div class="bg-slate-800/50 rounded-xl p-5 border border-slate-700/50 mb-4">
                        <div class="flex items-center gap-2 mb-3">
                            <div class="bg-${themeColor}-500/20 text-${themeColor}-400 px-3 py-1 rounded-full text-sm font-semibold border border-${themeColor}-500/30">
                                ${pName}
                            </div>
                            <span class="text-slate-400">➔</span>
                            <div class="bg-blue-500/20 text-blue-400 px-3 py-1 rounded-full text-sm font-semibold border border-blue-500/30">
                                สถิตภพ ${destHouseName}
                            </div>
                        </div>
                        <p class="text-lg text-white leading-relaxed mb-4">
                            <span class="font-bold text-${themeColor}-400">${pName} ในภพ ${destHouseName}:</span> 
                            ${meaning}
                        </p>
                `;

                html += `<div class="grid grid-cols-1 md:grid-cols-2 gap-3 mt-4 pt-4 border-t border-slate-700/50">`;

                if (motion !== 'ปกติ') {
                    const motionTxt = specialMotion[planet][motion];
                    html += `
                        <div class="flex flex-col">
                            <span class="text-xs text-slate-400">โคจร${motion}</span>
                            <span class="text-sm text-orange-400">${motionTxt}</span>
                        </div>
                    `;
                }

                html += `</div></div>`;
                
            } else {
                // ตรรกะเดิมสำหรับดาว ๑ - ๘ (มีเจ้าเรือน)
                const ruledHouseIndices = getRuledHouses(ascSign, planet);
                ruledHouseIndices.forEach(ruledIndex => {
                    const ruledHouseName = houses[ruledIndex];
                    const meaning = meaningsDB[ruledHouseName][destHouseName] || "ไม่พบข้อมูลคำทำนาย";

                    html += `
                        <div class="bg-slate-800/50 rounded-xl p-5 border border-slate-700/50 mb-4">
                            <div class="flex items-center gap-2 mb-3">
                                <div class="bg-yellow-500/20 text-yellow-400 px-3 py-1 rounded-full text-sm font-semibold border border-yellow-500/30">
                                    เจ้าเรือน ${ruledHouseName}
                                </div>
                                <span class="text-slate-400">➔</span>
                                <div class="bg-blue-500/20 text-blue-400 px-3 py-1 rounded-full text-sm font-semibold border border-blue-500/30">
                                    ภพ ${destHouseName}
                                </div>
                            </div>
                            <p class="text-lg text-white leading-relaxed mb-4">
                                <span class="font-bold text-yellow-400">${ruledHouseName} ไป ${destHouseName}:</span> 
                                ${meaning}
                            </p>
                    `;

                    html += `<div class="grid grid-cols-1 md:grid-cols-2 gap-3 mt-4 pt-4 border-t border-slate-700/50">`;

                    const autoDignities = getAutoDignity(planet, targetSign);
                    if (autoDignities.length > 0) {
                        html += `
                            <div class="flex flex-col">
                                <span class="text-xs text-slate-400">มาตรฐานดาว</span>
                                <span class="text-sm">${autoDignities.join(' และ ')}</span>
                            </div>
                        `;
                    }

                    if (motion !== 'ปกติ') {
                        const motionTxt = motionMeanings[ruledHouseName][motion] || "มีการเปลี่ยนแปลง/ล่าช้าผิดปกติ";
                        html += `
                            <div class="flex flex-col">
                                <span class="text-xs text-slate-400">โคจร${motion}</span>
                                <span class="text-sm text-orange-400">${motionTxt}</span>
                            </div>
                        `;
                    }

                    html += `</div></div>`;
                });
            }

            // 4. สร้างบล็อกสรุปสถานะพิเศษ (กาลกิณี / เพ็ญ / ดับ)
            const sunSignId = parseInt(elSunSign.value);
            let specialStatusHtml = '';

            // 4.1 เช็คกาลกิณี
            if (isKarakini) {
                if (destHouseName === 'วินาศ') {
                    specialStatusHtml += `
                        <div class="flex gap-2 items-start">
                            <span class="text-emerald-500 text-lg">✓</span>
                            <div>
                                <span class="text-emerald-400 font-medium">กาลกิณีตกวินาศ (ความเป็นกาลกิณีหายไป)</span>
                                <p class="text-sm text-slate-300 mt-1">ดาวกาลกิณีไปตกภพวินาศ ถือว่าดีมาก ความเป็นกาลกิณีหายไป ส่งผลดี ไม่ให้โทษร้ายตามความหมายเดิม</p>
                            </div>
                        </div>`;
                } else if (destHouseName === 'อริ' || destHouseName === 'มรณะ') {
                    specialStatusHtml += `
                        <div class="flex gap-2 items-start">
                            <span class="text-red-500 text-lg">☠</span>
                            <div>
                                <span class="text-red-500 font-bold">กาลกิณีตก ${destHouseName} (ไม่ดีอย่างยิ่ง)</span>
                                <p class="text-sm text-slate-300 mt-1">ให้โทษร้ายแรง สร้างความเสียหาย อุปสรรค หรือการพลัดพรากอย่างมาก</p>
                            </div>
                        </div>`;
                } else if (karakiniNeutralized) {
                    specialStatusHtml += `
                        <div class="flex gap-2 items-start">
                            <span class="text-yellow-500 text-lg">⚠</span>
                            <div>
                                <span class="text-white font-medium">ดาวกาลกิณีเดิม (ถูกลดทอนด้วยธาตุ)</span>
                                <p class="text-sm text-slate-400 mt-1">โคจรไปตกราศีธาตุ${targetElement} ทำให้ความร้ายกาจถูกดูดซับ พิษสงลดลง</p>
                            </div>
                        </div>`;
                } else {
                    specialStatusHtml += `
                        <div class="flex gap-2 items-start">
                            <span class="text-red-500 text-lg">⚠</span>
                            <div>
                                <span class="text-red-400 font-medium">ดาวกาลกิณีเดิม (ออกฤทธิ์เต็มที่)</span>
                                <p class="text-sm text-slate-300 mt-1">ตกในราศีที่เอื้อต่อการแสดงผล ต้องระวังอุปสรรค ความขัดแย้ง หรือความเสียหาย</p>
                            </div>
                        </div>`;
                }
            }

            // 4.2 เช็คดาวเพ็ญ / ดาวดับ อัตโนมัติ (เฉพาะดาว ๒, ๓, ๔, ๕, ๖, ๗)
            if ([2, 3, 4, 5, 6, 7].includes(planet)) {
                if (targetSign === sunSignId) {
                    // ร่วมราศีอาทิตย์ (เสี่ยงดับ)
                    specialStatusHtml += `
                        <div class="flex gap-2 items-start mt-3">
                            <span class="text-orange-500 text-lg">☀</span>
                            <div>
                                <span class="text-orange-400 font-bold">⚠️ ดาวร่วมราศีอาทิตย์ (เสี่ยงดาวดับ)</span>
                                <p class="text-sm text-slate-300 mt-1">
                                    ดาวดวงนี้สถิตราศีเดียวกับดวงอาทิตย์ <strong>โปรดเช็คองศาดาว: หากห่างจากอาทิตย์ในระยะ 0-6 องศา ถือว่าเป็น "ดาวดับ"</strong><br>
                                    <span class="text-xs text-slate-400">*ความหมาย: พลังงานดาวถูกอาทิตย์แผดเผา ทำให้คุณภาพลดลง หรือเรื่องราวของภพนั้นกลายเป็นเรื่องถูกปกปิด ซ่อนเร้น ไม่แสดงผลเต็มที่</span>
                                </p>
                            </div>
                        </div>`;
                } else if (targetSign === (sunSignId + 6) % 12) {
                    // เล็งอาทิตย์ (เพ็ญ)
                    specialStatusHtml += `
                        <div class="flex gap-2 items-start mt-3">
                            <span class="text-yellow-300 text-lg">🌕</span>
                            <div>
                                <span class="text-yellow-400 font-bold">ดาวเพ็ญ (สุกสว่างเต็มที่)</span>
                                <p class="text-sm text-slate-300 mt-1">
                                    ดาวดวงนี้ทำมุมเล็ง (180 องศา) กับดวงอาทิตย์ ถือเป็น "ดาวเพ็ญ" ส่งผลให้ดาวมีพลังงานเต็มเปี่ยม เรื่องราวของดาวและภพมีความโดดเด่น ชัดเจน และมีกำลังมาก
                                </p>
                            </div>
                        </div>`;
                }
            }

            // ถ้านำ Special Status มารวมแล้วมีค่า ให้แสดงกล่อง
            if (specialStatusHtml !== '') {
                html += `<div class="bg-slate-900/40 rounded-xl p-5 border border-slate-700/50 mt-4 space-y-2">
                            <h3 class="text-slate-300 font-semibold mb-3 border-b border-slate-700 pb-2">จุดสังเกตพิเศษ</h3>
                            ${specialStatusHtml}
                         </div>`;
            }
            // 5. ระบบดาวกุม & ดาวชุมนุม (Stellium)
            const checkedBoxes = Array.from(document.querySelectorAll('.conjunct-cb:checked')).map(cb => parseInt(cb.value));
            const conjunctVals = checkedBoxes.filter(v => v !== planet); // เอาดาวหลักออกถ้าเผลอติ๊กซ้ำ
            
            if (conjunctVals.length > 0) {
                const pNames = {1:'อาทิตย์', 2:'จันทร์', 3:'อังคาร', 4:'พุธ', 5:'พฤหัสบดี', 6:'ศุกร์', 7:'เสาร์', 8:'ราหู', 9:'เกตุ', 0:'มฤตยู'};
                
                // สร้างฐานข้อมูลดาวทุกดวงในภพนี้ (หลัก + กุม)
                let allPlanetsData = [];
                allPlanetsData.push({ id: planet, isMain: true, motion: motion });
                conjunctVals.forEach(v => {
                    const mNode = document.getElementById(`motion-${v}`);
                    allPlanetsData.push({ id: v, isMain: false, motion: mNode ? mNode.value : 'ปกติ' });
                });

                html += `<div class="bg-indigo-900/20 rounded-xl p-5 border border-indigo-500/30 mt-6 space-y-4 shadow-lg">`;

                // 5.1 แจ้งเตือนดาวชุมนุม (ถ้ามี 3 ดวงขึ้นไป)
                if (allPlanetsData.length >= 3) {
                    html += `
                        <div class="bg-red-900/40 rounded-lg p-4 border border-red-500/50">
                            <h3 class="text-red-400 font-bold mb-1 flex items-center gap-2"><span>⚠️</span> ดาวชุมนุม (Stellium)</h3>
                            <p class="text-sm text-slate-300">มีดาวกระจุกตัวอยู่รวมกันถึง <strong>${allPlanetsData.length} ดวง</strong> ในราศีนี้ ถือเป็นจุดโฟกัสหลักของชีวิต มีความซับซ้อน วุ่นวาย มีตัวแปรเข้ามาเกี่ยวข้องเยอะ และจะส่งผลกระทบอย่างรุนแรงต่อภพ ${destHouseName}</p>
                        </div>`;
                }

                // ค้นหา "ดาวประธาน" (ดาวที่มีมาตรฐานสูงสุดในกลุ่ม)
                let leaderPlanet = -1;
                let maxScore = -1;
                allPlanetsData.forEach(pObj => {
                    if(pObj.id === 9 || pObj.id === 0) return;
                    const digs = getAutoDignity(pObj.id, targetSign);
                    const digStr = digs.join('');
                    let score = 0;
                    if (digStr.includes('เกษตร')) score = 4;
                    else if (digStr.includes('มหาอุจจ์')) score = 3;
                    else if (digStr.includes('มหาจักร')) score = 2;
                    else if (digStr.includes('ราชาโชค')) score = 1;
                    
                    if (score > maxScore && score > 0) {
                        maxScore = score;
                        leaderPlanet = pObj.id;
                    }
                });

                // 5.2 สรุปสถานะดาวทั้งหมด (เช็คชื่อตัวละครก่อนเข้าฉาก)
                html += `<div class="pt-2">
                            <h3 class="text-indigo-300 font-bold mb-3 border-b border-indigo-500/30 pb-2">เช็คสถานะดาวในภพนี้</h3>
                            <ul class="space-y-2">`;
                
                allPlanetsData.forEach(pObj => {
                    const p = pObj.id;
                    const m = pObj.motion;
                    const isMain = pObj.isMain;
                    const pNameStr = pNames[p];
                    
                    let roleIcon = isMain ? "📌" : "🔹";
                    let roleText = isMain ? "ดาวหลัก" : "ดาวกุม";
                    if (p === leaderPlanet) { roleIcon = "👑"; roleText = "ดาวประธาน"; }

                    let digText = "<span class='text-slate-400'>- ไม่มีมาตรฐาน -</span>";
                    if (p !== 9 && p !== 0) {
                        const digs = getAutoDignity(p, targetSign);
                        if (digs.length > 0) digText = digs.join(', ');
                    } else {
                        digText = "<span class='text-purple-400'>ดาวเหนือความคาดหมาย</span>";
                    }

                    let motionAlert = "";
                    if (m !== 'ปกติ') {
                        motionAlert = `<span class="text-xs text-orange-400 ml-2 bg-orange-900/30 px-2 py-0.5 rounded font-semibold border border-orange-500/30">โคจร${m}</span>`;
                    }

                    html += `<li class="flex items-start text-sm text-slate-300">
                                <span class="mr-2">${roleIcon}</span>
                                <div>
                                    <strong class="text-white">${p} - ${pNameStr} (${roleText})</strong> : ${digText} ${motionAlert}
                                </div>
                             </li>`;
                });
                html += `   </ul>
                         </div>`;

                // 5.3 ถอดรหัสคู่ดาวแบบพบกันหมด (Pairwise) พร้อมระบุคำเตือนโคจรวิปริต
                html += `<div class="pt-4">
                            <h3 class="text-indigo-300 font-bold mb-3 border-b border-indigo-500/30 pb-2">การผสมพลังงาน (อิทธิพลคู่ดาว)</h3>
                            <div class="space-y-3">`;
                
                for (let i = 0; i < allPlanetsData.length; i++) {
                    for (let j = i + 1; j < allPlanetsData.length; j++) {
                        const p1Obj = allPlanetsData[i];
                        const p2Obj = allPlanetsData[j];
                        const p1 = p1Obj.id;
                        const p2 = p2Obj.id;
                        const minP = Math.min(p1, p2);
                        const maxP = Math.max(p1, p2);
                        
                        let pairMeaning = "";
                        if (minP === 0 || maxP === 0 || minP === 9 || maxP === 9) {
                            pairMeaning = (minP === 9 || maxP === 9) 
                                ? "มีสิ่งศักดิ์สิทธิ์คุ้มครอง มีลางสังหรณ์ หรือมีเรื่องแปลกประหลาด/ต่างประเทศเข้ามาผสมผสาน"
                                : "เกิดความพลิกผัน อาเพศ นวัตกรรม หรือการเปลี่ยนแปลงกะทันหันในเรื่องนั้นๆ";
                        } else {
                            const pairKey = `${minP}-${maxP}`;
                            pairMeaning = pairMeanings[pairKey] || "ส่งอิทธิพลผสมผสานกันตามธรรมชาติของดาว";
                        }

                        // ถ้าคู่ไหนดาวมีการโคจรวิปริต ให้พ่วงคำเตือนไปด้วย
                        let pairWarning = "";
                        if (p1Obj.motion !== 'ปกติ' || p2Obj.motion !== 'ปกติ') {
                            let errList = [];
                            
                            // ฟังก์ชันย่อยสำหรับแปลความหมายวิปริต
                            const getMotionDesc = (m) => {
                                if (m === 'พักร์') return 'ถอยหลัง/ซ้ำซาก';
                                if (m === 'มนท์') return 'ช้า/หยุดนิ่ง';
                                if (m === 'เสิร์ด') return 'รวดเร็ว/วู่วาม';
                                return '';
                            };

                            if (p1Obj.motion !== 'ปกติ') errList.push(`ดาว${pNames[p1]} โคจร${p1Obj.motion}(${getMotionDesc(p1Obj.motion)})`);
                            if (p2Obj.motion !== 'ปกติ') errList.push(`ดาว${pNames[p2]} โคจร${p2Obj.motion}(${getMotionDesc(p2Obj.motion)})`);
                            
                            pairWarning = `<div class="text-xs text-orange-400 mt-2 bg-orange-900/10 p-2 rounded border border-orange-500/20">⚠️ <strong>ระวัง:</strong> พลังงานคู่นี้ได้รับอิทธิพลจาก <u>${errList.join(' และ ')}</u> ทำให้ผลลัพธ์อาจพลิกผันไปจากความหมายปกติ</div>`;
                        }

                        html += `
                            <div class="bg-slate-800/50 rounded p-3 border border-slate-700/50">
                                <span class="text-sm font-semibold text-blue-300 block mb-1">ดาว ${p1} กุม ${p2} (${pNames[p1]} + ${pNames[p2]})</span>
                                <span class="text-sm text-slate-300">${pairMeaning}</span>
                                ${pairWarning}
                            </div>`;
                    }
                }
                html += `</div></div></div>`;
            }
            
            // แสดงผลขึ้นหน้าจอ!
            elResultContent.innerHTML = html;
        }

        // Event Listeners สำหรับการอัปเดตแบบ Real-time
        const inputs = [elBirthDay, elAscendant, elPlanet, elPlanetSign, elSunSign, elMotion];
        inputs.forEach(input => {
            input.addEventListener('change', calculateReading);
        });

        // Event: เมื่อติ๊ก Checkbox ให้ซ่อน/โชว์ Dropdown การโคจร
        document.querySelectorAll('.conjunct-cb').forEach(cb => {
            cb.addEventListener('change', (e) => {
                const selectEl = document.getElementById(`motion-${e.target.value}`);
                if (selectEl) {
                    if (e.target.checked) selectEl.classList.remove('hidden');
                    else {
                        selectEl.classList.add('hidden');
                        selectEl.value = 'ปกติ'; // เคลียร์ค่ากลับเป็นปกติ
                    }
                }
                calculateReading();
            });
        });

        // Event: เมื่อเปลี่ยนค่าใน Dropdown โคจรดาวกุม ให้คำนวณใหม่
        document.querySelectorAll('.conjunct-motion-select').forEach(sel => {
            sel.addEventListener('change', calculateReading);
        });

        // Initialize เริ่มการทำงานครั้งแรก
        window.onload = () => {
            initSelects();
            elAscendant.value = "0"; // ลัคนาเมษ
            elPlanet.value = "3"; // ดาวอังคาร (ตนุ, มรณะ)
            elPlanetSign.value = "1"; // ไปพฤษภ (กดุมภะ)
            calculateReading();
        };

    </script>
</body>
</html>
